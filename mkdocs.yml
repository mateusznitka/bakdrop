site_name: Bakdrop
site_description: Self-hosted file sharing through unique, self-expiring download links
site_url: https://mateusznitka.github.io/bakdrop/
repo_url: https://github.com/mateusznitka/bakdrop
repo_name: mateusznitka/bakdrop

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Requirements:
      - requirements/index.md
      - Docker: requirements/docker.md
      - Manual (Apache): requirements/manual.md
  - Installation:
      - installation/index.md
      - Docker: installation/docker.md
      - Manual (Apache): installation/manual.md
  - Configuration: configuration.md
  - Users & admin model: users.md
  - Automatic cleanup: cleanup.md
  - Audit logging: audit-logging.md
  - Large files & downloads: large-files.md
  - TLS certificates: tls.md
  - Troubleshooting: troubleshooting.md
  - Security notes: security.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search

extra_css:
  - stylesheets/extra.css
