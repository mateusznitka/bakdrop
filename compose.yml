services:
  app:
    container_name: bakdrop
    image: bakdrop
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUID: 1000   # set to `id -u` of the host user who writes to the files directory
        PGID: 1000   # set to `id -g` of that user
    volumes:
      - bakdrop_data:/var/lib/bakdrop
      - bakdrop_logs:/var/log/bakdrop
      - /bakdrop:/bakdrop
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BASE_URL=https://your-domain-or-ip
      - DEFAULT_LANG=en
      - TZ=Europe/Warsaw
    restart: unless-stopped

  # Background maintenance. Same image and data volumes as app, only the process
  # differs. Two jobs, see bakdrop-sidecar:
  #   every minute - keep the files directory accessible to the app, so files put
  #                  there by a backup restore (root-owned, unreadable) show up
  #   every hour   - cleanup.php: expired links and scheduled file deletion
  # Runs as root: resetting ownership on files written by other tools needs it.
  # cleanup.php itself is dropped back to www-data.
  cleanup:
    container_name: bakdrop-cleanup
    image: bakdrop
    depends_on:
      - app
    command: bakdrop-sidecar
    volumes:
      - bakdrop_data:/var/lib/bakdrop
      - bakdrop_logs:/var/log/bakdrop
      - /bakdrop:/bakdrop
    environment:
      - TZ=Europe/Warsaw
    restart: unless-stopped

volumes:
  bakdrop_data:
  bakdrop_logs:
