name: Release

# Build a ready-to-deploy package (app + bundled dependencies) and attach it to
# the GitHub Release whenever a version tag is pushed, e.g. `git tag v1.0.0 && git push --tags`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Sync APP_VERSION with the tag
        run: |
          sed -i "s/define('APP_VERSION', '[^']*')/define('APP_VERSION', '${{ steps.ver.outputs.version }}')/" helpers.php

      - name: Stage a clean package
        run: |
          mkdir -p dist/bakdrop
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='mkdocs.yml' \
            --exclude='notes.md' \
            --exclude='.gitignore' \
            --exclude='.dockerignore' \
            --exclude='Dockerfile.dev' \
            --exclude='compose.dev.yml' \
            --exclude='dist' \
            ./ dist/bakdrop/

      - name: Create tarball
        run: tar -czf "bakdrop-${{ steps.ver.outputs.version }}.tar.gz" -C dist bakdrop

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bakdrop-${{ steps.ver.outputs.version }}.tar.gz
          generate_release_notes: true
